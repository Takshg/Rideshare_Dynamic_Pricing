[project]
name = "rideshare-dynamic-pricing"
version = "0.1.0"
description = "Rideshare Dynamic Pricing Strategy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "joblib",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "black",
  "pytest",
  "pytest-cov",
  "pre-commit",
  "mypy",
  "types-requests",
  "statsmodels",
]

api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

explain = [
  "shap",
  "matplotlib",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"