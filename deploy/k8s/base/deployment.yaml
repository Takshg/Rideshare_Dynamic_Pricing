apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-pricing-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dynamic-pricing-api
  template:
    metadata:
      labels:
        app: dynamic-pricing-api
    spec:
      containers:
        - name: api
          image: dynamic-pricing-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_VERSION
              value: "v1"